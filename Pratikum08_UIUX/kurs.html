<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Kurs Mata Uang</title>
</head>
<body>
    <h2>Dolar</h2>
    <h4>Nilai Kurs Rupiah = Rp. 16.000.000</h4>
    <label for="dolar">Masukkan Jumlah Dolar:</label>
    <input type = "number" id="dolar">
    <br>
    <span id="hasil"></span>
    <button onclick="hitung_dolar()">Hitung</button>

    <hr>
    <br>

    <h2>Rupiah To Dolar</h2>
    <label for="rupiah">Masukkan Jumlah Rupiah:</label>
    <input type = "number" id="rupiah">
    <br>
    <span id="hasil2"></span>
    <button onclick="hitung_rupiah()">Hitung</button>


    <script>
        function hitung_dolar() {
            let rp = 16000; 
            let d = document.getElementById("dolar").value;
            let h = d * rp;
            document.getElementById("hasil").innerHTML = "Hasil = Rp. " + h;
        }
        function hitung_rupiah() {
            let rp2 = document.getElementById("rupiah").value;
            let h = rp2*(1/16000);
            document.getElementById("hasil2").innerHTML = "Dolar = $ " + h.toFixed(2);
        }
    </script>

    
</body>
</html>
